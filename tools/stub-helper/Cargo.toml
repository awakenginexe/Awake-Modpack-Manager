# Test stub for the Manager's native helper. It speaks only the read handshake, owns no
# modpacks and can never perform an operation. Replaced by the real shared-core helper build.
[package]
name = "awake-core-host-stub"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "awake-core-host"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
