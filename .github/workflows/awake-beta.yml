name: Manager Windows packages
run-name: Installer and portable ZIP (${{ inputs.release_tag || github.ref_name }})

# Pushing a version tag builds, verifies and publishes that release. Manual runs build an existing
# tag and only publish when asked. Nothing here creates a tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to build
        required: true
      publish:
        description: Publish a GitHub release with the results
        type: boolean
        default: false
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v*.*.*-beta.*', 'v*.*.*-rc.*', 'v*.*.*-alpha.*']

permissions:
  contents: read

concurrency:
  group: manager-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
      - name: Validate version tag
        working-directory: release-tools
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') { throw 'An existing version tag is required.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri
          cache-targets: false
      - name: Require and check authorized CurseForge configuration
        env:
          AWAKE_CORE_CURSEFORGE_API_KEY: ${{ secrets.AWAKE_CORE_CURSEFORGE_API_KEY }}
          AWAKE_CORE_CURSEFORGE_AUTHORIZED: ${{ vars.AWAKE_CORE_CURSEFORGE_AUTHORIZED }}
        run: |
          # An official build without CurseForge would look like a working one and silently lack a provider.
          if ($env:AWAKE_CORE_CURSEFORGE_AUTHORIZED -ne '1') { throw 'Repository variable AWAKE_CORE_CURSEFORGE_AUTHORIZED must be 1 for release builds.' }
          if ([string]::IsNullOrWhiteSpace($env:AWAKE_CORE_CURSEFORGE_API_KEY)) { throw 'Authorized CurseForge builds require the repository secret.' }
          $result = Invoke-RestMethod 'https://api.curseforge.com/v1/mods/search?gameId=432&searchFilter=jei&pageSize=1' -Headers @{ 'x-api-key' = $env:AWAKE_CORE_CURSEFORGE_API_KEY }
          if (!$result.data.Count) { throw 'Authorized CurseForge search returned no results.' }
          'Authorized CurseForge search passed; no credentials logged.'
      - name: Stage exact published Native Core
        run: |
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Tag and application version differ.' }
          "SOURCE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          $pin = Get-Content scripts/helper-pin.json -Raw | ConvertFrom-Json
          $name = "awake-core-manager-v$($pin.implementationVersion)-windows-x64.zip"
          $directory = $pin.sourceCommit.Substring(0,12)
          $base = "https://raw.githubusercontent.com/awakenginexe/Awake-Launcher/$($pin.deliveryCommit)/native-core/redistribution/$directory"
          Invoke-WebRequest "$base/$name" -OutFile "$env:RUNNER_TEMP/helper.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/helper.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) { throw 'Helper package does not match pin.' }
          Expand-Archive "$env:RUNNER_TEMP/helper.zip" "$env:RUNNER_TEMP/helper"
          node scripts/stage-helper.mjs --from "$env:RUNNER_TEMP/helper/core-host/windows-x64" $pin.sourceCommit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/stage-helper.mjs --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Corresponding source of the helper: rejoin the committed parts and check the whole archive.
          $delivery = Invoke-RestMethod "$base/delivery.json"
          $core = "$env:RUNNER_TEMP/$($pin.sourceArchive)"
          $out = [IO.File]::Create($core)
          foreach ($part in $delivery.sourceParts) {
            Invoke-WebRequest "$base/$($part.file)" -OutFile "$env:RUNNER_TEMP/part"
            if ((Get-FileHash "$env:RUNNER_TEMP/part" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $part.sha256) { throw "Source part $($part.file) does not match its delivery record." }
            $in = [IO.File]::OpenRead("$env:RUNNER_TEMP/part"); $in.CopyTo($out); $in.Close()
          }
          $out.Close()
          if ((Get-FileHash $core -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sourceArchiveSha256) { throw 'Rejoined Native Core source does not match pin.' }
          "CORE_SOURCE=$core" >> $env:GITHUB_ENV
          "CORE_ZIP=$env:RUNNER_TEMP/helper.zip" >> $env:GITHUB_ENV
          "CORE_ZIP_NAME=$name" >> $env:GITHUB_ENV
      - name: Build application and NSIS installer
        env:
          AWAKE_CORE_CURSEFORGE_API_KEY: ${{ secrets.AWAKE_CORE_CURSEFORGE_API_KEY }}
          AWAKE_CORE_CURSEFORGE_AUTHORIZED: ${{ vars.AWAKE_CORE_CURSEFORGE_AUTHORIZED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $cache 'NSIS'
          if (!(Test-Path -LiteralPath $nsis)) {
            gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern nsis-3.13.zip --dir "$env:RUNNER_TEMP/nsis-input"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ((Get-FileHash "$env:RUNNER_TEMP/nsis-input/nsis-3.13.zip" -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') { throw 'NSIS archive differs from the Tauri CLI pin.' }
            Expand-Archive "$env:RUNNER_TEMP/nsis-input/nsis-3.13.zip" "$env:RUNNER_TEMP/nsis-input/unpacked"
            New-Item -ItemType Directory -Path $cache -Force | Out-Null
            Copy-Item "$env:RUNNER_TEMP/nsis-input/unpacked/nsis-3.13" $nsis -Recurse
          }
          if ((Get-FileHash "$nsis/NSIS.exe" -Algorithm SHA1).Hash -ne '6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2') { throw 'Cached NSIS differs from the Tauri CLI pin.' }
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern nsis_tauri_utils.dll --dir "$nsis/Plugins/x86-unicode/additional" --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash "$nsis/Plugins/x86-unicode/additional/nsis_tauri_utils.dll" -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'NSIS plugin differs from the Tauri CLI pin.' }
          npm run desktop:build -- --bundles nsis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check the installer and assemble the release
        run: |
          $setups = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($setups.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          New-Item -ItemType Directory release-assets | Out-Null
          $setup = "$pwd/release-assets/Awake-Modpack-Manager-$env:RELEASE_TAG-Windows-x64-Setup.exe"
          Copy-Item $setups[0].FullName $setup
          $validation = ../release-tools/scripts/test-beta-installer.ps1 -Installer $setup -SourceDir $pwd -TestDir "$env:RUNNER_TEMP/Manager-setup-test"
          $validation.checks
          $name = "Awake-Modpack-Manager-$env:RELEASE_TAG-Windows-x64"
          $package = "$pwd/package/$name"
          New-Item -ItemType Directory "$package/core-host" -Force | Out-Null
          Copy-Item src-tauri/target/release/awake-modpack-manager.exe $package/
          Copy-Item src-tauri/helper-stage "$package/core-host/windows-x64" -Recurse
          foreach ($file in 'LICENSE','THIRD-PARTY-NOTICES.txt','licenses') { Copy-Item $file $package/ -Recurse }
          Set-Content "$package/Run-Manager.cmd" "@echo off`r`nstart `"`" `"%~dp0awake-modpack-manager.exe`"" -NoNewline -Encoding ascii
          $pin = Get-Content scripts/helper-pin.json -Raw | ConvertFrom-Json
          @{ repository="https://github.com/$env:GITHUB_REPOSITORY"; commit=$env:SOURCE_COMMIT; version=$env:RELEASE_TAG.Substring(1); nativeCoreSource=$pin.sourceCommit } | ConvertTo-Json | Set-Content "$package/SOURCE.json" -Encoding utf8
          Copy-Item ../release-tools/scripts/beta-start-here.txt "$package/START-HERE.txt"
          Copy-Item ../release-tools/scripts/beta-start-here.txt release-assets/START-HERE.txt
          Compress-Archive "package/$name" "release-assets/$name.zip" -CompressionLevel Optimal
          # GPL: the helper and its exact corresponding source travel with every release.
          Copy-Item $env:CORE_ZIP "release-assets/$env:CORE_ZIP_NAME"
          Copy-Item $env:CORE_SOURCE "release-assets/$($pin.sourceArchive)"
          git archive --format=zip -o "release-assets/Awake-Modpack-Manager-$env:RELEASE_TAG-Source.zip" HEAD
          git -C ../release-tools archive --format=zip -o "$pwd/release-assets/Awake-Modpack-Manager-Release-Tools-$($env:GITHUB_SHA.Substring(0,12))-Source.zip" HEAD
          @(
            "Awake Modpack Manager $env:RELEASE_TAG source and licenses",
            "",
            "Manager (GPL-3.0-only): Awake-Modpack-Manager-$env:RELEASE_TAG-Source.zip, commit $env:SOURCE_COMMIT.",
            "Native Core helper (GPL-3.0-only): $($pin.sourceArchive), commit $($pin.sourceCommit) of $($pin.sourceRepository).",
            "Release tooling: Awake-Modpack-Manager-Release-Tools-$($env:GITHUB_SHA.Substring(0,12))-Source.zip.",
            "Third-party notices ship inside the installer and the portable ZIP."
          ) | Set-Content release-assets/Awake-Modpack-Manager-SOURCE-AND-LICENSES.txt -Encoding utf8
          @{ sourceCommit=$env:SOURCE_COMMIT; workflowCommit=$env:GITHUB_SHA; tag=$env:RELEASE_TAG; nativeCoreSource=$pin.sourceCommit; nativeCoreVersion=$pin.implementationVersion; helperSha256=$pin.exeSha256; curseForge=$true; installerSmoke=$validation.checks; installerExecutableSha256=$validation.installerExecutableSha256; executableSha256=(Get-FileHash "$package/awake-modpack-manager.exe" -Algorithm SHA256).Hash.ToLowerInvariant(); workflowRun="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content release-assets/Awake-Modpack-Manager-BUILD-PROVENANCE.json -Encoding utf8
          # In-app updates verify the installer against this list.
          $sums = foreach ($file in Get-ChildItem release-assets -File | Sort-Object Name) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ascii
            "$hash  $($file.Name)"
          }
          $sums | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
          git diff --exit-code
          if ($LASTEXITCODE) { throw 'Application source changed during packaging.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Awake-Modpack-Manager-${{ env.RELEASE_TAG }}-Windows-x64
          path: source/release-assets/*
          if-no-files-found: error

  publish:
    needs: windows
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: Awake-Modpack-Manager-${{ env.RELEASE_TAG }}-Windows-x64
          path: assets
      - name: Publish the release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          notes="docs/releases/${RELEASE_TAG%%-*}.md"
          [ -f "$notes" ] && flags+=(--notes-file "$notes") || flags+=(--generate-notes)
          gh release create "$RELEASE_TAG" assets/* --verify-tag --title "Awake Modpack Manager $RELEASE_TAG" "${flags[@]}"
