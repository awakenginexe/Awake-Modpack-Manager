name: Manager checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Web checks
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Host tests
        run: |
          npm run helper:stub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The key is available to pushes and same-repository pull requests only, and is never printed.
      - name: Live CurseForge behaviour of the pinned Native Core
        if: ${{ vars.AWAKE_CORE_CURSEFORGE_AUTHORIZED == '1' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          AWAKE_CORE_CURSEFORGE_API_KEY: ${{ secrets.AWAKE_CORE_CURSEFORGE_API_KEY }}
          AWAKE_CORE_CURSEFORGE_AUTHORIZED: '1'
        run: |
          $pin = Get-Content scripts/helper-pin.json -Raw | ConvertFrom-Json
          $directory = $pin.sourceCommit.Substring(0,12)
          $url = "https://raw.githubusercontent.com/awakenginexe/Awake-Launcher/$($pin.deliveryCommit)/native-core/redistribution/$directory/awake-core-manager-v$($pin.implementationVersion)-windows-x64.zip"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/helper.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/helper.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.archiveSha256) { throw 'Helper package does not match pin.' }
          Expand-Archive "$env:RUNNER_TEMP/helper.zip" "$env:RUNNER_TEMP/helper"
          $env:AWAKE_CF_LIVE_HELPER = "$env:RUNNER_TEMP/helper/core-host/windows-x64/awake-core-host.exe"
          $env:AWAKE_CF_LIVE_PROFILE = "$env:RUNNER_TEMP/cf-profile"
          $failed = $false
          foreach ($check in @(@('npx', 'vitest', 'run', 'tests/realHelper/curseforgeLive.test.ts'), @('cargo', 'test', '--manifest-path', 'src-tauri/Cargo.toml', '--lib', '--', '--ignored', 'curseforge_live'))) {
            $out = & $check[0] $check[1..($check.Length - 1)] 2>&1 | Out-String
            Write-Output $out
            if ($LASTEXITCODE) {
              $failed = $true
              $tail = ($out -split "`n" | Where-Object { $_ -match 'Error|error|FAIL|panicked|expected' } | Select-Object -Last 12) -join ' | '
              "::error title=$($check[0]) live check::$($tail.Substring(0, [Math]::Min(1800, $tail.Length)))"
            }
          }
          if ($failed) { exit 1 }
