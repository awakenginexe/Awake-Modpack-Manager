name: Manager checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false
      - name: Web checks
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Host tests
        run: |
          npm run helper:stub
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # The key is available to pushes and same-repository pull requests only, and is never printed.
      # The helper itself cannot start on hosted runners: its private profile needs a non-administrator owner.
      - name: Live CurseForge catalog, icons and popular-first search
        if: ${{ vars.AWAKE_CORE_CURSEFORGE_AUTHORIZED == '1' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          AWAKE_CORE_CURSEFORGE_API_KEY: ${{ secrets.AWAKE_CORE_CURSEFORGE_API_KEY }}
          AWAKE_CORE_CURSEFORGE_AUTHORIZED: '1'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored curseforge_live
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
